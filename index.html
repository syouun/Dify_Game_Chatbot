<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        #game-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: #111827;
            border: 2px solid #ffffff;
        }
        #controls {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud"></div>
        <canvas id="gameCanvas"></canvas>
        <div id="controls">操作: 左右キー / A&D でパドル移動, スペースでスタート / リスタート</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script>
        const CONFIG = {
            CANVAS_WIDTH: 600,
            CANVAS_HEIGHT: 700,
            PADDLE_WIDTH: 100,
            PADDLE_HEIGHT: 20,
            BALL_RADIUS: 10,
            BLOCK_ROWS: 6,
            BLOCK_COLUMNS: 9,
            BLOCK_WIDTH: 60,
            BLOCK_HEIGHT: 20,
            MAX_LIFE: 3,
            MIN_VELOCITY: 100,
        };
        
        let canvas;
        let paddle;
        let ball;
        let blocks = [];
        let score = 0;
        let life = CONFIG.MAX_LIFE;
        let state = 'ready';
        let lastTime = null;
        let mouseX = CONFIG.CANVAS_WIDTH / 2;
        let rightPressed = false;
        let leftPressed = false;
        let blockColors = ['#FF5733', '#33FF57', '#3357FF', '#F1C40F', '#E74C3C', '#8E44AD'];
        
        function setup() {
            canvas = createCanvas(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
            paddle = { x: CONFIG.CANVAS_WIDTH / 2 - CONFIG.PADDLE_WIDTH / 2, width: CONFIG.PADDLE_WIDTH };
            ball = { x: paddle.x + CONFIG.PADDLE_WIDTH / 2, y: CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT - CONFIG.BALL_RADIUS - 1, vx: 0, vy: 0 };
            createBlocks();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            document.addEventListener('keydown', keyDownHandler);
            document.addEventListener('keyup', keyUpHandler);
            draw();
        }

        function resizeCanvas() {
            let container = document.getElementById('game-container');
            let aspectRatio = CONFIG.CANVAS_WIDTH / CONFIG.CANVAS_HEIGHT;
            let width = container.clientWidth;
            let height = container.clientHeight;
            if (width / height > aspectRatio) {
                width = height * aspectRatio;
            } else {
                height = width / aspectRatio;
            }
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
        }

        function createBlocks() {
            for (let r = 0; r < CONFIG.BLOCK_ROWS; r++) {
                for (let c = 0; c < CONFIG.BLOCK_COLUMNS; c++) {
                    blocks.push({ x: c * (CONFIG.BLOCK_WIDTH + 10), y: r * (CONFIG.BLOCK_HEIGHT + 10), width: CONFIG.BLOCK_WIDTH, height: CONFIG.BLOCK_HEIGHT, life: r < 2 ? 2 : 1, color: blockColors[r] });
                }
            }
        }

        function keyDownHandler(e) {
            if (e.key === 'ArrowRight' || e.key === 'd') {
                rightPressed = true;
            } else if (e.key === 'ArrowLeft' || e.key === 'a') {
                leftPressed = true;
            } else if (e.key === ' ') {
                if (state === 'ready') {
                    state = 'playing';
                    ball.vx = random(-200, 200);
                    ball.vy = -300;
                    ball.x = paddle.x + CONFIG.PADDLE_WIDTH / 2;
                    ball.y = CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT - CONFIG.BALL_RADIUS - 1;
                } else if (state === 'gameover' || state === 'clear') {
                    restart();
                }
                e.preventDefault();
            }
            if (e.key === 'p') {
                state = state === 'paused' ? 'playing' : 'paused';
            }
        }

        function keyUpHandler(e) {
            if (e.key === 'ArrowRight' || e.key === 'd') {
                rightPressed = false;
            } else if (e.key === 'ArrowLeft' || e.key === 'a') {
                leftPressed = false;
            }
            e.preventDefault();
        }

        function restart() {
            blocks = [];
            createBlocks();
            ball = { x: paddle.x + CONFIG.PADDLE_WIDTH / 2, y: CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT - CONFIG.BALL_RADIUS - 1, vx: 0, vy: 0 };
            score = 0;
            life = CONFIG.MAX_LIFE;
            state = 'ready';
            draw();
        }

        function draw() {
            background(220);
            if (lastTime === null) {
                lastTime = millis();
            }
            let now = millis();
            let dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            if (state === 'playing') {
                update(dt);
            }
            drawHUD();
            drawPaddle();
            drawBall();
            drawBlocks();
            if (state === 'paused') {
                drawOverlay('Paused');
            } else if (state === 'gameover') {
                drawOverlay('Game Over - Press Space to Restart');
            } else if (state === 'clear') {
                drawOverlay('Stage Clear! - Press Space to Next Stage');
            }
            requestAnimationFrame(draw);
        }

        function update(dt) {
            paddle.x = mouseX - CONFIG.PADDLE_WIDTH / 2;

            if (rightPressed) {
                paddle.x += 300 * dt;
            }
            if (leftPressed) {
                paddle.x -= 300 * dt;
            }
            paddle.x = constrain(paddle.x, 0, CONFIG.CANVAS_WIDTH - CONFIG.PADDLE_WIDTH);

            if (ball.vy === 0 && ball.vx === 0) {
                ball.x = paddle.x + CONFIG.PADDLE_WIDTH / 2;
                ball.y = CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT - CONFIG.BALL_RADIUS - 1;
            } else {
                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;

                // Wall collision
                if (ball.x + CONFIG.BALL_RADIUS > CONFIG.CANVAS_WIDTH || ball.x - CONFIG.BALL_RADIUS < 0) {
                    ball.vx *= -1;
                    ball.x = constrain(ball.x, CONFIG.BALL_RADIUS, CONFIG.CANVAS_WIDTH - CONFIG.BALL_RADIUS);
                }
                if (ball.y - CONFIG.BALL_RADIUS < 0) {
                    ball.vy *= -1;
                    ball.y = CONFIG.BALL_RADIUS;
                }

                // Paddle collision
                if (ball.y + CONFIG.BALL_RADIUS >= CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT) {
                    if (ball.x > paddle.x && ball.x < paddle.x + CONFIG.PADDLE_WIDTH) {
                        let collidePoint = ball.x - (paddle.x + CONFIG.PADDLE_WIDTH / 2);
                        collidePoint = map(collidePoint, -(CONFIG.PADDLE_WIDTH / 2), (CONFIG.PADDLE_WIDTH / 2), -60, 60);
                        let angle = collidePoint * (PI / 180);
                        ball.vx = 300 * cos(angle);
                        ball.vy = -300 * sin(angle);
                        ball.y = CONFIG.CANVAS_HEIGHT - CONFIG.PADDLE_HEIGHT - CONFIG.BALL_RADIUS - 1;
                    } else {
                        life--;
                        if (life < 0) {
                            state = 'gameover';
                            ball.vx = 0;
                            ball.vy = 0;
                        } else {
                            ball.vx = 0;
                            ball.vy = 0;
                        }
                    }
                }

                // Block collision
                for (let i = 0; i < blocks.length; i++) {
                    let block = blocks[i];
                    if (ball.x + CONFIG.BALL_RADIUS > block.x && ball.x - CONFIG.BALL_RADIUS < block.x + block.width &&
                        ball.y + CONFIG.BALL_RADIUS > block.y && ball.y - CONFIG.BALL_RADIUS < block.y + block.height) {
                        block.life--;
                        if (block.life <= 0) {
                            blocks.splice(i, 1);
                            score += 10;
                            ball.vy *= -1;
                        } else {
                            let overlapX = CONFIG.BALL
