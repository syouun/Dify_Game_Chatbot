<!DOCTYPE html>
<html>
<head>
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { border: 1px solid black; }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let isGameOver = false;

        function setup() {
            createCanvas(600, 400);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    bricks.push(new Brick(j * 75 + 10, i * 30 + 10));
                }
            }
        }

        function draw() {
            background(220);
            paddle.show();
            paddle.move();
            ball.show();
            ball.move();

            if (isGameOver) {
                textSize(32);
                fill(0);
                text("ゲームオーバー", width / 2 - 80, height / 2);
                textSize(16);
                text("Rで再スタート", width / 2 - 50, height / 2 + 30);
                return;
            }

            for (let i = bricks.length - 1; i >= 0; i--) {
                if (bricks[i].isHit(ball)) {
                    bricks.splice(i, 1);
                    ball.ySpeed *= -1;
                    score++;
                } else {
                    bricks[i].show();
                }
            }

            if (ball.isOffScreen()) {
                isGameOver = true;
            }

            fill(0);
            textSize(16);
            text("スコア: " + score, 10, 20);
        }

        function keyPressed() {
            if (key === 'R' && isGameOver) {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            ball = new Ball();
            bricks = [];
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    bricks.push(new Brick(j * 75 + 10, i * 30 + 10));
                }
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.diameter = 20;
                this.xSpeed = 5;
                this.ySpeed = -5;
            }

            show() {
                fill(127);
                ellipse(this.x, this.y, this.diameter);
            }

            move() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x > width - this.diameter / 2 || this.x < this.diameter / 2) {
                    this.xSpeed *= -1;
                }
                if (this.y < this.diameter / 2) {
                    this.ySpeed *= -1;
                }
                if (this.y > height) {
                    isGameOver = true;
                }
            }

            isOffScreen() {
                return this.y > height;
            }
        }

        class Paddle {
            constructor() {
                this.width = 100;
                this.height = 10;
                this.x = (width - this.width) / 2;
            }

            show() {
                fill(0);
                rect(this.x, height - this.height, this.width, this.height);
            }

            move() {
                if (keyIsDown(LEFT_ARROW)) {
                    this.x -= 10;
                }
                if (keyIsDown(RIGHT_ARROW)) {
                    this.x += 10;
                }
                this.x = constrain(this.x, 0, width - this.width);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 75;
                this.height = 20;
            }

            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }

            isHit(ball) {
                return ball.x > this.x && ball.x < this.x + this.width && ball.y + ball.diameter / 2 > this.y && ball.y - ball.diameter / 2 < this.y + this.height;
            }
        }
    </script>
</body>
</html>
