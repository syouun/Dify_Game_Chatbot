<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイバーパンクブロック崩し</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d0d;
            color: #00ff99;
            font-family: 'Courier New', Courier, monospace;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <div id="score">Score: 0</div>
    <script>
        let bricks = [];
        let paddle;
        let ball;
        let rows = 5;
        let cols = 10;
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            resetGame();
        }

        function resetGame() {
            bricks = [];
            score = 0;
            document.getElementById('score').innerText = 'Score: ' + score;
            gameOver = false;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    bricks.push({
                        x: i * (windowWidth / cols),
                        y: j * 60, // Changed distance between bricks and paddle to 2x
                        w: windowWidth / cols - 5,
                        h: 25,
                        destroyed: false
                    });
                }
            }

            paddle = {
                x: windowWidth / 2 - 50,
                y: windowHeight - 30,
                w: 100,
                h: 15
            };

            ball = {
                x: windowWidth / 2,
                y: windowHeight - 45,
                r: 10,
                xSpeed: 5,
                ySpeed: -5
            };
        }

        function draw() {
            background(13);
            drawBricks();
            drawPaddle();
            drawBall();
            handleCollisions();

            if (gameOver) {
                fill(255, 0, 0);
                textSize(32);
                textAlign(CENTER, CENTER);
                text('GAME OVER! Press R to Restart', windowWidth / 2, windowHeight / 2);
            }
        }

        function drawBricks() {
            for (let brick of bricks) {
                if (!brick.destroyed) {
                    fill(255, 255, 0); // Changed brick color to yellow
                    rect(brick.x, brick.y, brick.w, brick.h);
                }
            }
        }

        function drawPaddle() {
            fill(0, 102, 204);
            rect(paddle.x, paddle.y, paddle.w, paddle.h);
            if (keyIsDown(LEFT_ARROW) && paddle.x > 0) {
                paddle.x -= 10;
            }
            if (keyIsDown(RIGHT_ARROW) && paddle.x < width - paddle.w) {
                paddle.x += 10;
            }
        }

        function drawBall() {
            fill(255);
            ellipse(ball.x, ball.y, ball.r * 2);
            if (!gameOver) {
                ball.x += ball.xSpeed;
                ball.y += ball.ySpeed;

                if (ball.x < ball.r || ball.x > width - ball.r) {
                    ball.xSpeed *= -1;
                }
                if (ball.y < ball.r) {
                    ball.ySpeed *= -1;
                }
                if (ball.y > height - ball.r) {
                    gameOver = true;
                }
            }
        }

        function handleCollisions() {
            if (ball.y + ball.r >= paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                ball.ySpeed *= -1;
                ball.y = paddle.y - ball.r;
            }

            for (let brick of bricks) {
                if (!brick.destroyed) {
                    if (ball.x > brick.x && ball.x < brick.x + brick.w && ball.y - ball.r < brick.y + brick.h && ball.y + ball.r > brick.y) {
                        ball.ySpeed *= -1;
                        brick.destroyed = true;
                        score += 10;
                        document.getElementById('score').innerText = 'Score: ' + score;
                    }
                }
            }
        }

        function keyPressed() {
            if (key === 'R' || key === 'r') {
                resetGame();
            }
        }
    </script>
</body>
</html>
