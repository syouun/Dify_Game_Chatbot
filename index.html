<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 1px solid white;
        }
    </style>
</head>
<body>

<script>
let ball;
let paddle;
let bricks = [];
let score = 0;
let gameStarted = false;

function setup() {
    createCanvas(400, 600);
    ball = new Ball();
    paddle = new Paddle();
    for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 7; j++) {
            bricks.push(new Brick(j * 55 + 35, i * 20 + 30));
        }
    }
    textAlign(CENTER);
}

function draw() {
    background(51);
    if (gameStarted) {
        ball.update();
        ball.show();
        paddle.show();
        paddle.update();

        for (let i = bricks.length - 1; i >= 0; i--) {
            bricks[i].show();
            if (ball.hits(bricks[i])) {
                ball.reverseY();
                bricks.splice(i, 1);
                score++;
            }
        }

        if (ball.y > height) {
            noLoop();
            textSize(32);
            text('ゲームオーバー!', width / 2, height / 2);
            textSize(16);
            text('R キーを押して再スタート', width / 2, height / 2 + 30);
        }

        fill(255);
        textSize(20);
        text('スコア: ' + score, width / 2, 20);
    } else {
        textSize(32);
        text('ブロック崩し', width / 2, height / 2 - 20);
        textSize(16);
        text('スペースでゲームスタート', width / 2, height / 2 + 20);
    }
}

function keyPressed() {
    if (key === ' ') {
        gameStarted = true;
        ball.reset();
        score = 0;
        bricks = [];
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 7; j++) {
                bricks.push(new Brick(j * 55 + 35, i * 20 + 30));
            }
        }
        loop();
    }
    if (key === 'R' && !gameStarted) {
        setup();
        loop();
    }
}

class Ball {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = width / 2;
        this.y = height - 30;
        this.size = 20;
        this.xSpeed = 5;
        this.ySpeed = -5;
        this.onPaddle = true;
    }

    update() {
        if (!this.onPaddle) {
            this.x += this.xSpeed;
            this.y += this.ySpeed;

            if (this.x < this.size / 2 || this.x > width - this.size / 2) {
                this.xSpeed *= -1;
            }
            if (this.y < this.size / 2) {
                this.ySpeed *= -1;
            }
        } else {
            this.x = paddle.x + paddle.width / 2;
            this.y = paddle.y - this.size / 2;
        }
    }

    show() {
        fill(255);
        ellipse(this.x, this.y, this.size);
    }

    hits(brick) {
        return (this.x > brick.x && this.x < brick.x + brick.width &&
                this.y > brick.y && this.y < brick.y + brick.height);
    }

    reverseY() {
        this.ySpeed *= -1;
    }
}

class Paddle {
    constructor() {
        this.width = 80;
        this.height = 10;
        this.x = width / 2 - this.width / 2;
        this.y = height - this.height - 10;
    }

    show() {
        fill(255);
        rect(this.x, this.y, this.width, this.height);
    }

    update() {
        if (keyIsDown(LEFT_ARROW) && this.x > 0) {
            this.x -= 10;
        }
        if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
            this.x += 10;
        }
    }
}

class Brick {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 50;
        this.height = 20;
    }

    show() {
        fill(200, 50, 50);
        rect(this.x, this.y, this.width, this.height);
    }
}
</script>

</body>
</html>
