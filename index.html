<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルなブラウザゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <script>
        let score = 0;
        let target;
        let gameActive = true;

        function setup() {
            createCanvas(400, 400);
            spawnTarget();
        }

        function draw() {
            background(220);
            fill(0);
            textSize(24);
            text("スコア: " + score, 10, 30);
            
            if (gameActive) {
                fill(255, 0, 0);
                ellipse(target.x, target.y, 40, 40);
            } else {
                fill(0);
                textSize(32);
                text("ゲームオーバー", width / 2 - 80, height / 2);
                textSize(24);
                text("再スタート: スペースキー", width / 2 - 100, height / 2 + 40);
            }
        }

        function mousePressed() {
            if (gameActive) {
                let d = dist(mouseX, mouseY, target.x, target.y);
                if (d < 20) {
                    score++;
                    spawnTarget();
                }
            }
        }

        function keyPressed() {
            if (!gameActive && key === ' ') {
                resetGame();
            }
        }

        function spawnTarget() {
            target = createVector(random(20, width - 20), random(20, height - 20));
        }

        function resetGame() {
            score = 0;
            gameActive = true;
            spawnTarget();
        }
    </script>
</body>
</html>
