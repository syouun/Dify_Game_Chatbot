<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <script>
        let targetNumber;
        let userGuess = '';
        let message = "Guess a number between 1 and 100!";
        let attempts = 0;
        let gameWon = false;

        function setup() {
            createCanvas(400, 400);
            targetNumber = floor(random(1, 101));
            textAlign(CENTER, CENTER);
            textSize(24);
            noLoop();
        }

        function draw() {
            background(220);
            fill(0);
            text(message, width / 2, height / 2 - 20);
            text("Attempts: " + attempts, width / 2, height / 2 + 20);
            if(gameWon) {
                text("Press 'R' to Restart", width / 2, height / 2 + 60);
            }
        }

        function keyPressed() {
            if (keyCode >= 48 && keyCode <= 57) {
                userGuess += String.fromCharCode(keyCode);
            } else if (keyCode === BACKSPACE) {
                userGuess = userGuess.slice(0, -1);
            } else if (keyCode === ENTER && !gameWon) {
                checkGuess();
            } else if (key === 'R' && gameWon) {
                restartGame();
            }
            redraw();
        }

        function checkGuess() {
            let guess = parseInt(userGuess);
            attempts++;
            if (guess === targetNumber) {
                message = "Congratulations! You guessed it!";
                gameWon = true;
            } else if (guess < targetNumber) {
                message = "Too low! Try again.";
            } else if (guess > targetNumber) {
                message = "Too high! Try again.";
            }
            userGuess = '';
            redraw();
        }

        function restartGame() {
            targetNumber = floor(random(1, 101));
            attempts = 0;
            message = "Guess a number between 1 and 100!";
            gameWon = false;
            redraw();
        }
    </script>
</body>
</html>
