<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let lives = 3;
        let isGameOver = false;

        function setup() {
            createCanvas(600, 400);
            ball = new Ball();
            paddle = new Paddle();
            createBricks();
        }

        function draw() {
            background(0);
            if (isGameOver) {
                fill(255, 0, 0);
                textSize(32);
                text('GAME OVER', width / 2 - 80, height / 2);
                textSize(16);
                text('Press R to Restart', width / 2 - 70, height / 2 + 30);
                return;
            }

            ball.move();
            ball.display();
            paddle.display();
            paddle.move();

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].display();
                if (ball.hits(bricks[i])) {
                    ball.velocity.y *= -1;
                    bricks.splice(i, 1);
                    score++;
                }
            }

            if (ball.y > height) {
                lives--;
                if (lives <= 0) {
                    isGameOver = true;
                } else {
                    ball.reset();
                }
            }

            fill(255);
            textSize(16);
            text('Score: ' + score, 10, 20);
            text('Lives: ' + lives, width - 70, 20);
        }

        function createBricks() {
            let rows = 5;
            let cols = 10;
            let w = width / cols;
            let h = 20;
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    bricks.push(new Brick(i * w, j * h, w, h));
                }
            }
        }

        function keyPressed() {
            if (key === 'R' && isGameOver) {
                score = 0;
                lives = 3;
                isGameOver = false;
                bricks = [];
                createBricks();
                ball.reset();
            }
        }

        class Ball {
            constructor() {
                this.radius = 12;
                this.reset();
            }

            reset() {
                this.x = width / 2;
                this.y = height - 30;
                this.velocity = createVector(5, -5);
            }

            move() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                if (this.x < this.radius || this.x > width - this.radius) {
                    this.velocity.x *= -1;
                }
                if (this.y < this.radius) {
                    this.velocity.y *= -1;
                }
            }

            display() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }

            hits(brick) {
                return this.x > brick.x && this.x < brick.x + brick.w && this.y + this.radius > brick.y && this.y - this.radius < brick.y + brick.h;
            }
        }

        class Paddle {
            constructor() {
                this.width = 100;
                this.height = 20;
                this.x = (width - this.width) / 2;
            }

            display() {
                fill(255);
                rect(this.x, height - this.height, this.width, this.height);
            }

            move() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= 10;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
                    this.x += 10;
                }
            }
        }

        class Brick {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
            }

            display() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.w, this.h);
            }
        }
    </script>
</body>
</html>
