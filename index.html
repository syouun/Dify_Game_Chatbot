<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石取りゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <script>
        let stones = 21;
        let currentPlayer = 1;
        let gameOver = false;
        let message = '';

        function setup() {
            createCanvas(400, 200);
            textAlign(CENTER, CENTER);
            textSize(24);
        }

        function draw() {
            background(255);
            fill(0);
            text(`石の数: ${stones}`, width / 2, height / 3);
            text(`プレイヤー: ${currentPlayer}`, width / 2, height / 2);
            if (gameOver) {
                text(message, width / 2, height * 2 / 3);
                text('Rキーで再スタート', width / 2, height * 5 / 6);
            } else {
                text('1～3の石を取ってください', width / 2, height * 5 / 6);
            }
        }

        function keyPressed() {
            if (gameOver && key === 'r') {
                resetGame();
            } else if (!gameOver && (key === '1' || key === '2' || key === '3')) {
                let stonesTaken = int(key);
                if (stones - stonesTaken >= 0) {
                    stones -= stonesTaken;
                    if (stones === 0) {
                        gameOver = true;
                        message = `プレイヤー ${currentPlayer} の勝ち!`;
                    } else {
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                    }
                }
            }
        }

        function resetGame() {
            stones = 21;
            currentPlayer = 1;
            gameOver = false;
            message = '';
        }
    </script>
</body>
</html>
