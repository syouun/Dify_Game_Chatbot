<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネコがリンゴをキャッチするゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <script>
        let cat;
        let apple;
        let score = 0;
        let gameState = "PLAY";

        function setup() {
            createCanvas(400, 400);
            cat = new Cat();
            apple = createApple();
        }

        function draw() {
            background(200);
            if (gameState === "PLAY") {
                cat.update();
                apple.display();

                if (cat.hits(apple)) {
                    score++;
                    apple = createApple();
                }

                fill(0);
                textSize(24);
                text("スコア: " + score, 10, 30);
            } else if (gameState === "GAME_OVER") {
                fill(0);
                textSize(32);
                text("ゲームオーバー！", 50, height / 2 - 20);
                textSize(24);
                text("スコア: " + score, 150, height / 2 + 20);
                text("スペースキーで再スタート", 70, height / 2 + 70);
            }
        }

        function createApple() {
            return {
                x: random(width),
                y: random(height),
                size: 20,
                display: function() {
                    fill(255, 0, 0);
                    ellipse(this.x, this.y, this.size);
                }
            };
        }

        class Cat {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.size = 30;
            }
            update() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= 5;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.size) {
                    this.x += 5;
                }
                this.display();
            }
            display() {
                fill(255, 165, 0);
                rect(this.x, this.y, this.size, this.size);
            }
            hits(apple) {
                return (this.x < apple.x + apple.size && 
                        this.x + this.size > apple.x && 
                        this.y < apple.y + apple.size && 
                        this.y + this.size > apple.y);
            }
        }

        function keyPressed() {
            if (gameState === "GAME_OVER" && key === " ") {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            gameState = "PLAY";
            apple = createApple();
        }
    </script>
</body>
</html>
