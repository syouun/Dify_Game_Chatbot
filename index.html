<!DOCTYPE html>
<html>
<head>
    <title>ブロック崩し</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
            background: #eee;
        }
        #restart {
            display: none;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="restart">
        <button onclick="restartGame()">再スタート</button>
    </div>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let isGameOver = false;

        function setup() {
            createCanvas(480, 320);
            ball = new Ball();
            paddle = new Paddle();
            createBricks();
        }

        function draw() {
            background(200);
            ball.update();
            ball.show();
            paddle.show();
            paddle.update();

            if (isGameOver) {
                fill(0);
                textSize(32);
                textAlign(CENTER);
                text("ゲームオーバー", width / 2, height / 2);
                textSize(16);
                text("スコア: " + score, width / 2, height / 2 + 30);
                document.getElementById("restart").style.display = "block";
            } else {
                for (let i = bricks.length - 1; i >= 0; i--) {
                    bricks[i].show();
                    if (bricks[i].hit(ball)) {
                        score++;
                        bricks.splice(i, 1);
                        ball.reverseY();
                    }
                }

                if (ball.hits(paddle)) {
                    ball.reverseY();
                }

                if (ball.offScreen()) {
                    isGameOver = true;
                }

                fill(0);
                textSize(16);
                text("スコア: " + score, 70, 20);
            }
        }

        function createBricks() {
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    bricks.push(new Brick(j * 60 + 10, i * 20 + 30));
                }
            }
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            bricks = [];
            createBricks();
            ball = new Ball();
            document.getElementById("restart").style.display = "none";
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.size = 20;
                this.xSpeed = 5;
                this.ySpeed = -5;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;
                if (this.x > width - this.size / 2 || this.x < this.size / 2) {
                    this.xSpeed *= -1;
                }
                if (this.y < this.size / 2) {
                    this.ySpeed *= -1;
                }
            }

            show() {
                fill(127);
                ellipse(this.x, this.y, this.size);
            }

            reverseY() {
                this.ySpeed *= -1;
            }

            offScreen() {
                return this.y > height;
            }

            hits(paddle) {
                return this.x > paddle.x && this.x < paddle.x + paddle.width && this.y + this.size / 2 > paddle.y;
            }
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = width / 2 - this.width / 2;
                this.y = height - this.height - 10;
                this.speed = 10;
            }

            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }

            update() {
                if (keyIsDown(LEFT_ARROW)) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW)) {
                    this.x += this.speed;
                }
                this.x = constrain(this.x, 0, width - this.width);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 20;
            }

            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }

            hit(ball) {
                return ball.x > this.x && ball.x < this.x + this.width && ball.y + ball.size / 2 > this.y && ball.y - ball.size / 2 < this.y + this.height;
            }
        }
    </script>
</body>
</html>
