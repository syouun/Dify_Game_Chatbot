<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: blue; color: white; }
        h1 { position: absolute; top: 20px; }
        #restart { position: absolute; top: 70px; display: none; }
    </style>
</head>
<body>
    <h1>スコア: <span id="score">0</span></h1>
    <button id="restart">再スタート</button>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        const rows = 5;
        const cols = 7;
        const brickWidth = 80;
        const brickHeight = 20;
        const paddleWidth = 100;
        const paddleHeight = 10;
        let leftPressed = false;
        let rightPressed = false;

        function setup() {
            createCanvas(560, 400);
            ball = new Ball();
            paddle = new Paddle();

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * brickWidth + 10, r * brickHeight + 40));
                }
            }

            document.getElementById('restart').addEventListener('click', restart);
            frameRate(120);
        }

        function draw() {
            background(0);
            ball.update();
            ball.show();
            ball.checkCollision(paddle);
            paddle.show();

            if (leftPressed) {
                paddle.move(-20);
            }
            if (rightPressed) {
                paddle.move(20);
            }

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.checkBrickCollision(bricks[i])) {
                    bricks.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                }
            }

            if (bricks.length === 0) {
                textAlign(CENTER);
                textSize(32);
                fill(255);
                text('勝った！', width / 2, height / 2);
                noLoop();
                document.getElementById('restart').style.display = 'block';
            }
        }

        function keyPressed() {
            if (keyCode === LEFT_ARROW) {
                leftPressed = true;
            } else if (keyCode === RIGHT_ARROW) {
                rightPressed = true;
            }
        }

        function keyReleased() {
            if (keyCode === LEFT_ARROW) {
                leftPressed = false;
            } else if (keyCode === RIGHT_ARROW) {
                rightPressed = false;
            }
        }

        function restart() {
            score = 0;
            document.getElementById('score').innerText = score;
            bricks = [];
            ball = new Ball();
            paddle = new Paddle();

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * brickWidth + 10, r * brickHeight + 40));
                }
            }

            loop();
            document.getElementById('restart').style.display = 'none';
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.radius = 10;
                this.xSpeed = 5;
                this.ySpeed = -5;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x > width - this.radius || this.x < this.radius) {
                    this.xSpeed *= -1;
                }

                if (this.y < this.radius) {
                    this.ySpeed *= -1;
                } else if (this.y > height) {
                    noLoop();
                    document.getElementById('restart').style.display = 'block';
                }
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }

            checkCollision(paddle) {
                if (this.y + this.radius >= paddle.y && this.x > paddle.x && this.x < paddle.x + paddleWidth) {
                    this.ySpeed *= -1;
                    this.y = paddle.y - this.radius;
                }
            }

            checkBrickCollision(brick) {
                if (this.x > brick.x && this.x < brick.x + brickWidth && this.y - this.radius < brick.y + brickHeight && this.y + this.radius > brick.y) {
                    this.ySpeed *= -1;
                    return true;
                }
                return false;
            }
        }

        class Paddle {
            constructor() {
                this.x = width / 2 - paddleWidth / 2;
                this.y = height - paddleHeight - 10;
            }

            move(step) {
                this.x += step;
                this.x = constrain(this.x, 0, width - paddleWidth);
            }

            show() {
                fill(255);
                rect(this.x, this.y, paddleWidth, paddleHeight);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }

            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, brickWidth, brickHeight);
            }
        }

        window.addEventListener('keyup', keyReleased);
    </script>
</body>
</html>
