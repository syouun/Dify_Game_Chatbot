<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #000; }
        canvas { border: 1px solid #fff; }
    </style>
</head>
<body>
    <script>
        let paddle;
        let ball;
        let bricks = [];
        let rows = 5;
        let cols = 10;
        let brickWidth;
        let brickHeight = 20;
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(400, 400);
            paddle = new Paddle();
            ball = new Ball();
            brickWidth = width / cols;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * brickWidth, i * brickHeight));
                }
            }
        }

        function draw() {
            background(0);
            paddle.show();
            paddle.move();
            ball.show();
            ball.move();
            ball.bounceEdge();
            ball.bouncePaddle(paddle);

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.hitBrick(bricks[i])) {
                    bricks.splice(i, 1);
                    score++;
                }
            }

            textSize(16);
            fill(255);
            text('Score: ' + score, 10, height - 10);

            if (gameOver) {
                textSize(32);
                textAlign(CENTER);
                text('Game Over', width / 2, height / 2);
                textSize(16);
                text('Press R to Restart', width / 2, height / 2 + 30);
                noLoop();
            }
        }

        function keyPressed() {
            if (key === 'R' || key === 'r') {
                resetGame();
            }
        }

        function resetGame() {
            score = 0;
            gameOver = false;
            ball.reset();
            bricks = [];
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * brickWidth, i * brickHeight));
                }
            }
            loop();
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = width / 2 - this.width / 2;
                this.y = height - this.height - 10;
                this.speed = 5;
            }
            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
            move() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
                    this.x += this.speed;
                }
            }
        }

        class Ball {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = width / 2;
                this.y = height / 2;
                this.radius = 10;
                this.xSpeed = random(-3, 3);
                this.ySpeed = 3;
            }
            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }
            move() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;
            }
            bounceEdge() {
                if (this.x < this.radius || this.x > width - this.radius) {
                    this.xSpeed *= -1;
                }
                if (this.y < this.radius) {
                    this.ySpeed *= -1;
                }
                if (this.y > height) {
                    gameOver = true;
                }
            }
            bouncePaddle(paddle) {
                if (this.y + this.radius > paddle.y && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                    this.ySpeed *= -1;
                    this.y = paddle.y - this.radius;
                }
            }
            hitBrick(brick) {
                if (!brick.hit && this.x > brick.x && this.x < brick.x + brickWidth && this.y - this.radius < brick.y + brickHeight && this.y + this.radius > brick.y) {
                    this.ySpeed *= -1;
                    brick.hit = true;
                    return true;
                }
                return false;
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.hit = false;
            }
            show() {
                if (!this.hit) {
                    fill(255, 0, 0);
                    rect(this.x, this.y, brickWidth, brickHeight);
                }
            }
        }
    </script>
</body>
</html>
