<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let blocks = [];
        let score = 0;
        let lives = 3;
        let gameStarted = false;
        
        function setup() {
            createCanvas(800, 600);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 7; i++) {
                for (let j = 0; j < 5; j++) {
                    blocks.push(new Block(i * 113 + 50, j * 30 + 50));
                }
            }
        }
        
        function draw() {
            background(51);
            paddle.show();
            paddle.update();
            ball.show();
            ball.update();

            // Draw blocks
            for (let i = blocks.length - 1; i >= 0; i--) {
                if (blocks[i].isHit(ball)) {
                    blocks.splice(i, 1);
                    ball.speedY *= -1;
                    score++;
                } else {
                    blocks[i].show();
                }
            }
            
            // Display score and lives
            textSize(20);
            fill(255);
            text(`Score: ${score}`, 10, 30);
            text(`Lives: ${lives}`, 10, 60);

            if (ball.y > height) {
                lives--;
                ball.reset();
                if (lives <= 0) {
                    resetGame();
                }
            }
        }
        
        function resetGame() {
            score = 0;
            lives = 3;
            blocks = [];
            for (let i = 0; i < 7; i++) {
                for (let j = 0; j < 5; j++) {
                    blocks.push(new Block(i * 113 + 50, j * 30 + 50));
                }
            }
        }
        
        function keyPressed() {
            if (keyCode === ENTER) {
                gameStarted = true;
                ball.reset();
            }
        }
        
        class Ball {
            constructor() {
                this.radius = 12;
                this.x = width / 2;
                this.y = height - 30;
                this.speedX = 5;
                this.speedY = -5;
            }
            
            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }
            
            update() {
                if (gameStarted) {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < this.radius || this.x > width - this.radius) {
                        this.speedX *= -1;
                    }
                    if (this.y < this.radius) {
                        this.speedY *= -1;
                    }
                    if (this.y > height - this.radius) {
                        lives--;
                        this.reset();
                    }
                    if (this.y + this.radius >= paddle.y && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                        this.speedY *= -1;
                    }
                }
            }
            
            reset() {
                this.x = width / 2;
                this.y = height - 30;
                this.speedX = 5;
                this.speedY = -5;
            }
        }
        
        class Paddle {
            constructor() {
                this.width = 100;
                this.height = 20;
                this.x = (width - this.width) / 2;
                this.y = height - this.height - 10;
            }
            
            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
            
            update() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= 10;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
                    this.x += 10;
                }
            }
        }
        
        class Block {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 100;
                this.height = 20;
            }
            
            show() {
                fill(200, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }
            
            isHit(ball) {
                return ball.x > this.x && ball.x < this.x + this.width && ball.y - ball.radius < this.y + this.height && ball.y + ball.radius > this.y;
            }
        }
    </script>
</body>
</html>
