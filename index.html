<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩し</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #eee; }
        canvas { border: 1px solid black; }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let rows = 5;
        let cols = 7;
        let score = 0;
        let isGameOver = false;

        function setup() {
            createCanvas(400, 400);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * 60 + 40, i * 20 + 40));
                }
            }
        }

        function draw() {
            background(200);
            if (isGameOver) {
                textSize(32);
                fill(0);
                text("Game Over", width / 3, height / 2);
                return;
            }
            paddle.show();
            ball.show();
            ball.update();

            if (ball.checkPaddle(paddle)) {
                ball.speedY *= -1;
            }
            for (let i = bricks.length - 1; i >= 0; i--) {
                if (ball.checkBrick(bricks[i])) {
                    bricks.splice(i, 1);
                    ball.speedY *= -1;
                    score++;
                }
            }

            for (let brick of bricks) {
                brick.show();
            }

            if (ball.outOfBounds()) {
                isGameOver = true;
            }

            fill(0);
            textSize(16);
            text("Score: " + score, 10, 20);
        }

        function keyPressed() {
            if (keyCode === RIGHT_ARROW) {
                paddle.move(10);
            } else if (keyCode === LEFT_ARROW) {
                paddle.move(-10);
            } else if (key === 'R' && isGameOver) {
                resetGame();
            }
        }

        function resetGame() {
            ball = new Ball();
            paddle = new Paddle();
            bricks = [];
            score = 0;
            isGameOver = false;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * 60 + 40, i * 20 + 40));
                }
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.radius = 10;
                this.speedX = 5;
                this.speedY = -5;
            }

            show() {
                fill(150);
                ellipse(this.x, this.y, this.radius * 2);
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < this.radius || this.x > width - this.radius) {
                    this.speedX *= -1;
                }
                if (this.y < this.radius) {
                    this.speedY *= -1;
                }
            }

            checkPaddle(paddle) {
                return this.y + this.radius > paddle.y && this.x > paddle.x && this.x < paddle.x + paddle.width;
            }

            checkBrick(brick) {
                return (
                    this.x > brick.x &&
                    this.x < brick.x + brick.width &&
                    this.y - this.radius < brick.y + brick.height &&
                    this.y + this.radius > brick.y
                );
            }

            outOfBounds() {
                return this.y > height;
            }
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = (width - this.width) / 2;
                this.y = height - 20;
            }

            show() {
                fill(100);
                rect(this.x, this.y, this.width, this.height);
            }

            move(step) {
                this.x += step;
                this.x = constrain(this.x, 0, width - this.width);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 20;
            }

            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
