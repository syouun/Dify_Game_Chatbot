<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
        }
        canvas {
            border: 2px solid white;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="score">スコア: 0</div>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let isGameOver = false;

        function setup() {
            createCanvas(600, 400);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 5; j++) {
                    bricks.push(new Brick(i * 100 + 50, j * 30 + 30));
                }
            }
        }

        function draw() {
            background(0);
            if (isGameOver) {
                textSize(32);
                fill(255, 0, 0);
                text('ゲームオーバー', width / 2 - 100, height / 2);
                fill(255);
                textSize(16);
                text('Rで再スタート', width / 2 - 50, height / 2 + 30);
                return;
            }
            
            ball.update();
            ball.show();
            paddle.show();
            paddle.update();

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.hits(bricks[i])) {
                    bricks.splice(i, 1);
                    ball.ySpeed *= -1;
                    score++;
                    document.getElementById('score').innerText = 'スコア: ' + score;
                }
            }

            if (ball.y > height) {
                isGameOver = true;
            }
        }

        function keyPressed() {
            if (key === 'R' && isGameOver) {
                resetGame();
            }
        }

        function resetGame() {
            bricks = [];
            score = 0;
            isGameOver = false;
            document.getElementById('score').innerText = 'スコア: 0';
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < 5; j++) {
                    bricks.push(new Brick(i * 100 + 50, j * 30 + 30));
                }
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.size = 20;
                this.xSpeed = 4;
                this.ySpeed = -4;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x > width - this.size / 2 || this.x < this.size / 2) {
                    this.xSpeed *= -1;
                }

                if (this.y < this.size / 2) {
                    this.ySpeed *= -1;
                }

                if (this.y > height) {
                    isGameOver = true;
                }

                if (this.y + this.size / 2 >= paddle.y && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                    this.ySpeed *= -1;
                    this.y = paddle.y - this.size / 2;
                }
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.size);
            }

            hits(brick) {
                return this.x > brick.x && this.x < brick.x + brick.width && this.y - this.size / 2 < brick.y + brick.height && this.y + this.size / 2 > brick.y;
            }
        }

        class Paddle {
            constructor() {
                this.width = 100;
                this.height = 20;
                this.x = width / 2 - this.width / 2;
                this.y = height - 20;

                this.update = () => {
                    this.x = mouseX - this.width / 2;
                    this.x = constrain(this.x, 0, width - this.width);
                }

                this.show = () => {
                    fill(200);
                    rect(this.x, this.y, this.width, this.height);
                }
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 80;
                this.height = 20;
            }

            show() {
                fill(255, 100, 100);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
