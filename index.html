<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { border: 1px solid black; }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let blocks = [];
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(600, 400);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 3; j++) {
                    blocks.push(new Block(i * 120 + 50, j * 20 + 30));
                }
            }
        }

        function draw() {
            background(220);
            if (gameOver) {
                textSize(32);
                fill(0);
                text("Game Over", width / 2 - 80, height / 2);
                textSize(16);
                text("スコア: " + score, width / 2 - 40, height / 2 + 30);
                text("Rで再スタート", width / 2 - 70, height / 2 + 60);
                return;
            }

            ball.update();
            ball.show();
            paddle.show();
            paddle.update();

            for (let i = blocks.length - 1; i >= 0; i--) {
                if (ball.hits(blocks[i])) {
                    blocks.splice(i, 1);
                    ball.ySpeed *= -1;
                    score++;
                }
            }

            for (let block of blocks) {
                block.show();
            }

            if (blocks.length === 0) {
                gameOver = true;
            }

            fill(0);
            textSize(16);
            text("スコア: " + score, 10, 20);
        }

        function keyPressed() {
            if (key === 'R' || key === 'r') {
                resetGame();
            }
        }

        function resetGame() {
            blocks = [];
            score = 0;
            gameOver = false;
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 3; j++) {
                    blocks.push(new Block(i * 120 + 50, j * 20 + 30));
                }
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.diameter = 20;
                this.xSpeed = 5;
                this.ySpeed = -5;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x < this.diameter / 2 || this.x > width - this.diameter / 2) {
                    this.xSpeed *= -1;
                }
                if (this.y < this.diameter / 2) {
                    this.ySpeed *= -1;
                }
                if (this.y > height) {
                    gameOver = true;
                }

                if (this.y + this.diameter / 2 >= paddle.y && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                    this.ySpeed *= -1;
                    this.y = paddle.y - this.diameter / 2;
                }
            }

            show() {
                fill(127);
                ellipse(this.x, this.y, this.diameter);
            }

            hits(block) {
                return this.x > block.x && this.x < block.x + block.width && this.y - this.diameter / 2 < block.y + block.height && this.y + this.diameter / 2 > block.y;
            }
        }

        class Paddle {
            constructor() {
                this.width = 100;
                this.height = 10;
                this.x = width / 2 - this.width / 2;
                this.y = height - this.height;
            }

            update() {
                if (keyIsDown(LEFT_ARROW)) {
                    this.x -= 10;
                } 
                if (keyIsDown(RIGHT_ARROW)) {
                    this.x += 10;
                }
                this.x = constrain(this.x, 0, width - this.width);
            }

            show() {
                fill(0);
                rect(this.x, this.y, this.width, this.height);
            }
        }

        class Block {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 100;
                this.height = 20;
            }

            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
