<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let gameStarted = false;

        function setup() {
            createCanvas(400, 400);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 4; j++) {
                    bricks.push(new Brick(i * 70 + 40, j * 30 + 30));
                }
            }
        }

        function draw() {
            background(0);
            if (gameStarted) {
                ball.update();
                ball.show();
                paddle.show();
                paddle.update();

                for (let i = bricks.length - 1; i >= 0; i--) {
                    bricks[i].show();
                    if (ball.hits(bricks[i])) {
                        ball.ySpeed *= -1;
                        bricks.splice(i, 1);
                        score++;
                    }
                }

                if (ball.y > height) {
                    gameOver();
                }

                fill(255);
                textSize(16);
                text("スコア: " + score, 10, height - 10);
            } else {
                fill(255);
                textSize(32);
                textAlign(CENTER);
                text("クリックしてスタート", width / 2, height / 2);
            }
        }

        function mousePressed() {
            if (!gameStarted) {
                gameStarted = true;
                ball.reset();
                score = 0;
                bricks = [];
                for (let i = 0; i < 5; i++) {
                    for (let j = 0; j < 4; j++) {
                        bricks.push(new Brick(i * 70 + 40, j * 30 + 30));
                    }
                }
            }
        }

        function gameOver() {
            gameStarted = false;
            fill(255);
            textSize(32);
            textAlign(CENTER);
            text("ゲームオーバー", width / 2, height / 2);
            textSize(16);
            text("クリックして再スタート", width / 2, height / 2 + 40);
        }

        class Ball {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = width / 2;
                this.y = height - 30;
                this.diameter = 20;
                this.xSpeed = 5;
                this.ySpeed = -5;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x < 0 || this.x > width) {
                    this.xSpeed *= -1;
                }
                if (this.y < 0) {
                    this.ySpeed *= -1;
                }
                if (this.y > height - 30 && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                    this.ySpeed *= -1;
                }
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.diameter);
            }

            hits(brick) {
                if (this.x > brick.x && this.x < brick.x + brick.width && this.y > brick.y && this.y < brick.y + brick.height) {
                    return true;
                }
                return false;
            }
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = width / 2 - this.width / 2;
            }

            update() {
                this.x = mouseX - this.width / 2;
                this.x = constrain(this.x, 0, width - this.width);
            }

            show() {
                fill(255);
                rect(this.x, height - this.height, this.width, this.height);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 20;
            }

            show() {
                fill(200, 100, 100);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
