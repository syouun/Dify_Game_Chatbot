<!DOCTYPE html>
<html>
<head>
    <title>ブロック崩し</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
            background: #eee;
        }
        #restart {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        
        function setup() {
            createCanvas(480, 320);
            ball = new Ball();
            paddle = new Paddle();
            // Create bricks
            let rows = 5;
            let cols = 8;
            let brickWidth = width / cols;
            let brickHeight = 20;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * brickWidth, r * brickHeight, brickWidth, brickHeight));
                }
            }
            let restartButton = createButton('再スタート');
            restartButton.id('restart');
            restartButton.mousePressed(restart);
        }

        function draw() {
            background(200);

            if (gameOver) {
                textAlign(CENTER);
                textSize(32);
                fill(0);
                text('ゲームオーバー', width / 2, height / 2);
                document.getElementById('restart').style.display = 'block';
                return;
            }

            ball.update();
            ball.show();
            paddle.show();

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.hits(bricks[i])) {
                    bricks.splice(i, 1);
                    ball.reverse();
                    score++;
                }
            }

            if (ball.offScreen()) {
                lives--;
                if (lives <= 0) {
                    gameOver = true;
                } else {
                    ball.reset();
                }
            }

            paddle.update();
            fill(0);
            textSize(16);
            text('スコア: ' + score, 10, 20);
            text('残りライフ: ' + lives, 10, 40);
        }

        function keyPressed() {
            if (keyCode === LEFT_ARROW) {
                paddle.move(-15);
            } else if (keyCode === RIGHT_ARROW) {
                paddle.move(15);
            }
        }

        function keyReleased() {
            if (keyCode === LEFT_ARROW || keyCode === RIGHT_ARROW) {
                paddle.move(0);
            }
        }

        function restart() {
            score = 0;
            lives = 3;
            gameOver = false;
            bricks = [];
            setup();
            document.getElementById('restart').style.display = 'none';
        }

        class Ball {
            constructor() {
                this.reset();
            }
            reset() {
                this.position = createVector(width / 2, height - 30);
                this.velocity = createVector(2.5, -2.5); // 速さを半分に変更
                this.radius = 10;
            }
            update() {
                this.position.add(this.velocity);
                if (this.position.x > width - this.radius || this.position.x < this.radius) {
                    this.velocity.x *= -1;
                }
                if (this.position.y < this.radius) {
                    this.velocity.y *= -1;
                }
            }
            show() {
                fill(127);
                ellipse(this.position.x, this.position.y, this.radius * 2);
            }
            reverse() {
                this.velocity.y *= -1;
            }
            offScreen() {
                return this.position.y > height;
            }
            hits(brick) {
                let hit = this.position.x > brick.x && this.position.x < brick.x + brick.width &&
                          this.position.y + this.radius > brick.y && this.position.y - this.radius < brick.y + brick.height;
                return hit;
            }
        }

        class Paddle {
            constructor() {
                this.position = createVector(width / 2, height - 10);
                this.width = 75;
                this.speed = 0;
            }
            move(speed) {
                this.speed = speed;
            }
            update() {
                this.position.x += this.speed;
                this.position.x = constrain(this.position.x, 0, width - this.width);
            }
            show() {
                fill(255);
                rect(this.position.x, height - 10, this.width, 10);
            }
        }

        class Brick {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }
            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
