<!DOCTYPE html>
<html>
<head>
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let rows = 5;
        let cols = 7;
        let score = 0;
        let gameStarted = false;

        function setup() {
            createCanvas(400, 400).id('gameCanvas');
            ball = new Ball();
            paddle = new Paddle();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * 55 + 35, r * 20 + 30));
                }
            }
        }

        function draw() {
            background(0);
            paddle.show();
            paddle.update();

            if (gameStarted) {
                ball.update();
                ball.show();
                ball.checkCollision(paddle);
                for (let i = bricks.length - 1; i >= 0; i--) {
                    bricks[i].show();
                    if (ball.checkCollision(bricks[i])) {
                        bricks.splice(i, 1);
                        score++;
                    }
                }
                if (ball.offscreen()) {
                    gameStarted = false;
                }
            }

            fill(255);
            textSize(16);
            text("Score: " + score, 10, height - 10);
            if (!gameStarted) {
                text("Press SPACE to Start", width / 2 - 60, height / 2);
            }
        }

        function keyPressed() {
            if (key === ' ') {
                if (!gameStarted) {
                    resetGame();
                }
                gameStarted = true;
            }
        }

        function resetGame() {
            score = 0;
            ball = new Ball();
            paddle = new Paddle();
            bricks = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * 55 + 35, r * 20 + 30));
                }
            }
        }

        class Ball {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = width / 2;
                this.y = height - 30;
                this.radius = 12;
                this.xSpeed = random(2, 4);
                this.ySpeed = -4;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;

                if (this.x < this.radius || this.x > width - this.radius) {
                    this.xSpeed *= -1;
                }
                if (this.y < this.radius) {
                    this.ySpeed *= -1;
                }
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }

            checkCollision(obj) {
                if (obj instanceof Paddle) {
                    if (this.y + this.radius >= obj.y && this.x >= obj.x && this.x <= obj.x + obj.width) {
                        this.ySpeed *= -1;
                        this.y = obj.y - this.radius;
                        return true;
                    }
                } else if (obj instanceof Brick) {
                    if (this.x + this.radius > obj.x && this.x - this.radius < obj.x + obj.width && 
                        this.y + this.radius > obj.y && this.y - this.radius < obj.y + obj.height) {
                        this.ySpeed *= -1;
                        this.y = obj.y - this.radius;
                        return true;
                    }
                }
                return false;
            }

            offscreen() {
                return this.y > height;
            }
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = (width - this.width) / 2;
                this.y = height - this.height - 10;
            }

            update() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= 5;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
                    this.x += 5;
                }
            }

            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 50;
                this.height = 15;
            }

            show() {
                fill(200, 50, 50);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
