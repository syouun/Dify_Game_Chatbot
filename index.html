<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
        }
    </style>
</head>
<body>
    <script>
        let paddle;
        let ball;
        let bricks = [];
        let cols = 10;
        let rows = 5;
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(800, 600);
            paddle = new Paddle();
            ball = new Ball();
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * 80 + 10, i * 30 + 40));
                }
            }
        }

        function draw() {
            background(0);
            paddle.show();
            paddle.update();
            
            ball.show();
            ball.update();
            ball.checkPaddle(paddle);
            ball.checkEdges();
            
            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.hits(bricks[i])) {
                    ball.reverse('y');
                    bricks.splice(i, 1);
                    score++;
                }
            }
            
            fill(255);
            textSize(24);
            text('Score: ' + score, 10, 590);
            
            if (gameOver) {
                fill(255, 0, 0);
                textSize(48);
                textAlign(CENTER, CENTER);
                text('Game Over', width / 2, height / 2);
                textSize(24);
                text('Press R to Restart', width / 2, height / 2 + 50);
            }
        }

        function keyPressed() {
            if (key === 'a' || key === 'A') {
                paddle.isMovingLeft = true;
            } else if (key === 'd' || key === 'D') {
                paddle.isMovingRight = true;
            } else if (key === 'r' || key === 'R' && gameOver) {
                resetGame();
            }
        }

        function keyReleased() {
            if (key === 'a' || key === 'A') {
                paddle.isMovingLeft = false;
            } else if (key === 'd' || key === 'D') {
                paddle.isMovingRight = false;
            }
        }

        function resetGame() {
            gameOver = false;
            score = 0;
            bricks = [];
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * 80 + 10, i * 30 + 40));
                }
            }
            ball = new Ball();
        }

        class Paddle {
            constructor() {
                this.width = 150;
                this.height = 20;
                this.x = width / 2 - this.width / 2;
                this.y = height - this.height - 10;
                this.isMovingLeft = false;
                this.isMovingRight = false;
                this.speed = 7;
            }

            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }

            update() {
                if (this.isMovingLeft) {
                    this.x -= this.speed;
                } else if (this.isMovingRight) {
                    this.x += this.speed;
                }
                this.x = constrain(this.x, 0, width - this.width);
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.radius = 12;
                this.xspeed = 5;
                this.yspeed = 5;
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }

            update() {
                this.x += this.xspeed;
                this.y += this.yspeed;
                if (this.y > height) {
                    gameOver = true;
                }
            }

            checkEdges() {
                if (this.x < 0 || this.x > width) {
                    this.xspeed *= -1;
                }
                if (this.y < 0) {
                    this.yspeed *= -1;
                }
            }

            checkPaddle(paddle) {
                if (this.y + this.radius > paddle.y && this.y < paddle.y + paddle.height && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                    this.yspeed *= -1;
                    this.y = paddle.y - this.radius;
                }
            }

            hits(brick) {
                let distance = dist(this.x, this.y, brick.x + brick.w / 2, brick.y + brick.h / 2);
                return distance < this.radius + max(brick.w, brick.h) / 2;
            }

            reverse(dir) {
                if (dir === 'x') {
                    this.xspeed *= -1;
                } else if (dir === 'y') {
                    this.yspeed *= -1;
                }
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.w = 70;
                this.h = 20;
            }

            show() {
                fill(200, 0, 255);
                rect(this.x, this.y, this.w, this.h);
            }
        }
    </script>
</body>
</html>
