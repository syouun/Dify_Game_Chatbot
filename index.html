<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
<script>
    let snake;
    let rez = 20;
    let food;
    let w;
    let h;
    let score = 0;

    function setup() {
        createCanvas(400, 400);
        w = floor(width / rez);
        h = floor(height / rez);
        frameRate(10);
        snake = new Snake();
        foodLocation();
    }

    function foodLocation() {
        let x = floor(random(w));
        let y = floor(random(h));
        food = createVector(x, y);
    }

    function keyPressed() {
        if (keyCode === LEFT_ARROW) {
            snake.setDir(-1, 0);
        } else if (keyCode === RIGHT_ARROW) {
            snake.setDir(1, 0);
        } else if (keyCode === DOWN_ARROW) {
            snake.setDir(0, 1);
        } else if (keyCode === UP_ARROW) {
            snake.setDir(0, -1);
        }
    }

    function draw() {
        scale(rez);
        background(220);
        snake.update();
        snake.show();

        if (snake.eat(food)) {
            foodLocation();
            score++;
        }

        noStroke();
        fill(255, 0, 0);
        rect(food.x, food.y, 1, 1);

        fill(0);
        textSize(1);
        text('Score: ' + score, 1, 1);

        if (snake.endGame()) {
            background(255, 0, 0);
            textSize(3);
            fill(255);
            textAlign(CENTER, CENTER);
            text('Game Over', w / 2, h / 2);
            noLoop();
        }
    }

    function mousePressed() {
        if (snake.endGame()) {
            score = 0;
            snake = new Snake();
            loop();
        }
    }

    class Snake {
        constructor() {
            this.body = [];
            this.body[0] = createVector(floor(w / 2), floor(h / 2));
            this.xdir = 0;
            this.ydir = 0;
            this.len = 0;
        }

        setDir(x, y) {
            this.xdir = x;
            this.ydir = y;
        }

        update() {
            let head = this.body[this.body.length - 1].copy();

            this.body.shift();

            head.x += this.xdir;
            head.y += this.ydir;
            this.body.push(head);

            if (head.x < 0) {
                head.x = w - 1;
            } else if (head.x >= w) {
                head.x = 0;
            }

            if (head.y < 0) {
                head.y = h - 1;
            } else if (head.y >= h) {
                head.y = 0;
            }
        }

        grow() {
            let head = this.body[this.body.length - 1].copy();
            this.len++;
            this.body.push(head);
        }

        endGame() {
            let x = this.body[this.body.length - 1].x;
            let y = this.body[this.body.length - 1].y;
            for (let i = 0; i < this.body.length - 1; i++) {
                let part = this.body[i];
                if (part.x === x && part.y === y) {
                    return true;
                }
            }
            return false;
        }

        eat(pos) {
            let x = this.body[this.body.length - 1].x;
            let y = this.body[this.body.length - 1].y;
            if (x === pos.x && y === pos.y) {
                this.grow();
                return true;
            }
            return false;
        }

        show() {
            for (let i = 0; i < this.body.length; i++) {
                fill(0);
                noStroke();
                rect(this.body[i].x, this.body[i].y, 1, 1);
            }
        }
    }
</script>
</body>
</html>
