<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #gameCanvas {
            border: 5px solid #333;
            border-radius: 10px;
            background-color: #fff;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="gameCanvas">
        <h1>クリックゲーム</h1>
        <p>スコア: <span id="score">0</span></p>
        <button id="restartButton" style="display:none;">再スタート</button>
    </div>

    <script>
        let score = 0;
        let isGameActive = true;

        function setup() {
            createCanvas(400, 400).parent('gameCanvas');
            let button = createButton('クリックしてスコアを加算');
            button.mousePressed(incrementScore);
            button.parent('gameCanvas');
            button.position(50, 200);
            button.size(300, 50);
        }

        function draw() {
            background(200);
            fill(0);
            textSize(32);
            textAlign(CENTER, CENTER);
            text("スコア: " + score, width / 2, height / 4);
            if (!isGameActive) {
                textSize(24);
                text("ゲームオーバー!", width / 2, height / 2);
                document.getElementById('restartButton').style.display = 'block';
            }
        }

        function incrementScore() {
            if (isGameActive) {
                score++;
                if (score >= 10) { // 10点でゲームオーバー
                    isGameActive = false;
                }
            }
        }

        document.getElementById('restartButton').addEventListener('click', restartGame);

        function restartGame() {
            score = 0;
            isGameActive = true;
            document.getElementById('restartButton').style.display = 'none';
        }
    </script>
</body>
</html>
