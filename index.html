<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <meta charset="utf-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
    <script>
        const CONFIG = {
            minNumber: 1, // 最小の数
            maxNumber: 100, // 最大の数
            maxAttempts: 10, // 最大の試行回数
            textSize: 32, // 文字の大きさ
            textColor: '#000000', // 文字の色
            bgColor: '#a0d8ef', // 背景色
            buttonColor: '#ffcc00', // ボタンの色
            buttonHoverColor: '#ff9900', // ボタンのホバー色
        };

        let targetNumber;
        let attempts;
        let gameOver;
        let message;
        let input;
        let guessButton;

        function setup() {
            createCanvas(800, 600);
            textSize(CONFIG.textSize);
            resetGame();

            input = createInput();
            input.position(20, height - 50);
            input.size(100);

            guessButton = createButton('こたえる');
            guessButton.position(input.x + input.width + 10, height - 50);
            guessButton.style('background-color', CONFIG.buttonColor);
            guessButton.mousePressed(() => {
                const userGuess = parseInt(input.value());
                if (!isNaN(userGuess)) {
                    guessNumber(userGuess);
                }
            });

            input.changed(() => {
                const userGuess = parseInt(input.value());
                if (!isNaN(userGuess)) {
                    guessNumber(userGuess);
                }
            });
        }

        function draw() {
            background(CONFIG.bgColor);
            fill(CONFIG.textColor);
            textAlign(CENTER, CENTER);
            text(message, width / 2, height / 2 - 100);

            if (gameOver) {
                text("R キーを押してもう一度！", width / 2, height / 2 + 100);
            }
        }

        function resetGame() {
            targetNumber = floor(random(CONFIG.minNumber, CONFIG.maxNumber + 1));
            attempts = 0;
            gameOver = false;
            message = `1 から ${CONFIG.maxNumber} のすうじをあててね！`;
            if (input) {
                input.value('');
            }
        }

        function keyPressed() {
            if (gameOver && (key === 'R' || key === 'r')) {
                resetGame();
            }
            if (keyCode === ENTER) {
                const userGuess = parseInt(input.value());
                if (!isNaN(userGuess)) {
                    guessNumber(userGuess);
                }
            }
            return keyCode !== UP_ARROW && keyCode !== DOWN_ARROW && keyCode !== LEFT_ARROW && keyCode !== RIGHT_ARROW && keyCode !== 32;
        }

        function mousePressed() {
            if (gameOver) {
                resetGame();
            }
        }

        function guessNumber(userGuess) {
            if (!gameOver) {
                attempts++;
                if (userGuess < targetNumber) {
                    message = `${userGuess} はちいさいよ！あと ${CONFIG.maxAttempts - attempts} かい。`;
                } else if (userGuess > targetNumber) {
                    message = `${userGuess} はおおきいよ！あと ${CONFIG.maxAttempts - attempts} かい。`;
                } else {
                    message = `おめでとう！${userGuess} がせいかい！`;
                    gameOver = true;
                }

                if (attempts >= CONFIG.maxAttempts && !gameOver) {
                    message = `ざんねん！せいかいは ${targetNumber} でした。`;
                    gameOver = true;
                }
            }
        }
    </script>
</body>
</html>
