<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神経衰弱ゲーム</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        #gameCanvas {
            border: 2px solid #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script>
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        const cols = 4;
        const rows = 4;
        const totalPairs = (cols * rows) / 2;

        function setup() {
            createCanvas(400, 400).id('gameCanvas');
            let values = [];
            for (let i = 0; i < totalPairs; i++) {
                values.push(i);
                values.push(i);
            }
            values = shuffle(values);

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    let card = new Card(i * 100, j * 100, values.pop());
                    cards.push(card);
                }
            }
        }

        function draw() {
            background(255);
            cards.forEach(card => card.show());
            if (matchedPairs === totalPairs) {
                fill(0, 255, 0);
                textSize(32);
                textAlign(CENTER, CENTER);
                text("You Win!", width / 2, height / 2);
                noLoop();
            }
        }

        function mousePressed() {
            if (flippedCards.length < 2) {
                cards.forEach(card => {
                    if (card.contains(mouseX, mouseY) && !card.flipped) {
                        card.flip();
                        flippedCards.push(card);
                    }
                });

                if (flippedCards.length === 2) {
                    setTimeout(checkMatch, 1000);
                }
            }
        }

        function checkMatch() {
            if (flippedCards[0].value === flippedCards[1].value) {
                flippedCards[0].matched = true;
                flippedCards[1].matched = true;
                matchedPairs++;
            } else {
                flippedCards[0].flip();
                flippedCards[1].flip();
            }
            flippedCards = [];
        }

        class Card {
            constructor(x, y, value) {
                this.x = x;
                this.y = y;
                this.value = value;
                this.flipped = false;
                this.matched = false;
            }

            show() {
                stroke(0);
                fill(this.flipped || this.matched ? 200 : 100);
                rect(this.x, this.y, 100, 100);
                if (this.flipped || this.matched) {
                    fill(0);
                    textSize(32);
                    textAlign(CENTER, CENTER);
                    text(this.value, this.x + 50, this.y + 50);
                }
            }

            contains(px, py) {
                return px > this.x && px < this.x + 100 && py > this.y && py < this.y + 100;
            }

            flip() {
                this.flipped = !this.flipped;
            }
        }
    </script>
</head>
<body>
</body>
</html>
