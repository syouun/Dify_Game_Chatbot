<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
    <script>
        let snake;
        let food;
        let resolution = 20;
        let cols;
        let rows;

        function setup() {
            createCanvas(400, 400);
            frameRate(10);
            cols = floor(width / resolution);
            rows = floor(height / resolution);
            snake = new Snake();
            foodLocation();
        }

        function foodLocation() {
            let x = floor(random(cols));
            let y = floor(random(rows));
            food = createVector(x, y);
        }

        function draw() {
            scale(resolution);
            background(220);
            if (snake.eat(food)) {
                foodLocation();
            }
            snake.update();
            snake.show();

            if (snake.endGame()) {
                print("END GAME");
                background(255, 0, 0);
                noLoop();
            }
            
            noStroke();
            fill(255, 0, 0);
            rect(food.x, food.y, 1, 1);
        }

        function keyPressed() {
            if (keyCode === LEFT_ARROW) {
                snake.setDir(-1, 0);
            } else if (keyCode === RIGHT_ARROW) {
                snake.setDir(1, 0);
            } else if (keyCode === DOWN_ARROW) {
                snake.setDir(0, 1);
            } else if (keyCode === UP_ARROW) {
                snake.setDir(0, -1);
            }
        }

        class Snake {
            constructor() {
                this.body = [];
                this.body[0] = createVector(floor(cols / 2), floor(rows / 2));
                this.xdir = 0;
                this.ydir = 0;
                this.len = 0;
            }

            setDir(x, y) {
                this.xdir = x;
                this.ydir = y;
            }

            update() {
                let head = this.body[this.body.length - 1].copy();

                this.body.shift();

                head.x += this.xdir;
                head.y += this.ydir;
                this.body.push(head);
            }

            grow() {
                let head = this.body[this.body.length - 1].copy();
                this.len++;
                this.body.push(head);
            }

            endGame() {
                let x = this.body[this.body.length - 1].x;
                let y = this.body[this.body.length - 1].y;
                if (x > cols - 1 || x < 0 || y > rows - 1 || y < 0) {
                    return true;
                }
                for (let i = 0; i < this.body.length - 1; i++) {
                    let part = this.body[i];
                    if (part.x === x && part.y === y) {
                        return true;
                    }
                }
                return false;
            }

            eat(pos) {
                let x = this.body[this.body.length - 1].x;
                let y = this.body[this.body.length - 1].y;
                if (x === pos.x && y === pos.y) {
                    this.grow();
                    return true;
                }
                return false;
            }

            show() {
                for (let i = 0; i < this.body.length; i++) {
                    fill(0);
                    noStroke();
                    rect(this.body[i].x, this.body[i].y, 1, 1);
                }
            }
        }
    </script>
</body>
</html>
