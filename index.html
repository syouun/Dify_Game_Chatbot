<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩し</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #333; color: white; }
        canvas { border: 1px solid white; }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(400, 600);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 7; i++) {
                for (let j = 0; j < 5; j++) {
                    bricks.push(new Brick(i * 50 + 25, j * 20 + 30));
                }
            }
        }

        function draw() {
            background(0);
            ball.update();
            ball.show();
            paddle.show();
            paddle.update();

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.hits(bricks[i])) {
                    ball.ySpeed *= -1;
                    bricks.splice(i, 1);
                    score++;
                }
            }

            if (ball.y > height) {
                gameOver = true;
            }

            if (gameOver) {
                fill(255, 0, 0);
                textSize(32);
                text('Game Over', width / 2 - 80, height / 2);
                textSize(16);
                text('Score: ' + score, width / 2 - 30, height / 2 + 30);
                text('Press R to Restart', width / 2 - 100, height / 2 + 60);
            } else {
                fill(255);
                textSize(16);
                text('Score: ' + score, 10, 20);
            }
        }

        function keyPressed() {
            if (key === ' ') {
                ball.launch();
            }
            if (key === 'R' && gameOver) {
                restart();
            }
        }

        function restart() {
            ball = new Ball();
            paddle = new Paddle();
            bricks = [];
            score = 0;
            gameOver = false;
            for (let i = 0; i < 7; i++) {
                for (let j = 0; j < 5; j++) {
                    bricks.push(new Brick(i * 50 + 25, j * 20 + 30));
                }
            }
        }

        class Ball {
            constructor() {
                this.radius = 12;
                this.x = width / 2;
                this.y = height - 30;
                this.xSpeed = 5;
                this.ySpeed = -5;
                this.launched = false;
            }
            update() {
                if (this.launched) {
                    this.x += this.xSpeed;
                    this.y += this.ySpeed;

                    if (this.x < this.radius || this.x > width - this.radius) {
                        this.xSpeed *= -1;
                    }
                    if (this.y < this.radius) {
                        this.ySpeed *= -1;
                    }
                    if (this.hits(paddle)) {
                        this.ySpeed *= -1;
                        this.y = paddle.y - this.radius;
                    }
                }
            }
            launch() {
                this.launched = true;
            }
            hits(p) {
                return (this.x > p.x && this.x < p.x + p.width && this.y + this.radius > p.y);
            }
            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = width / 2 - this.width / 2;
                this.y = height - 20;
            }
            update() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= 10;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
                    this.x += 10;
                }
            }
            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 50;
                this.height = 20;
            }
            show() {
                fill(255, 100, 100);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
