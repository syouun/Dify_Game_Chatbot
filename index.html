<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Breaker Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
        }
        canvas {
            border: 1px solid #fff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        const brickRows = 5;
        const brickCols = 8;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 30;
        
        function setup() {
            createCanvas(800, 600);
            ball = new Ball();
            paddle = new Paddle();

            for (let c = 0; c < brickCols; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRows; r++) {
                    let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r] = new Brick(brickX, brickY);
                }
            }
        }

        function draw() {
            background(0);
            ball.update();
            ball.checkEdges();
            ball.checkPaddle(paddle);

            for (let c = 0; c < brickCols; c++) {
                for (let r = 0; r < brickRows; r++) {
                    let brick = bricks[c][r];
                    if (brick.visible) {
                        brick.show();
                        if (ball.hits(brick)) {
                            brick.visible = false;
                            ball.reverseY();
                        }
                    }
                }
            }

            paddle.update();
            paddle.show();
            ball.show();
        }

        function keyPressed() {
            if (keyCode === LEFT_ARROW) {
                paddle.isMovingLeft = true;
            } else if (keyCode === RIGHT_ARROW) {
                paddle.isMovingRight = true;
            }
        }

        function keyReleased() {
            if (keyCode === LEFT_ARROW) {
                paddle.isMovingLeft = false;
            } else if (keyCode === RIGHT_ARROW) {
                paddle.isMovingRight = false;
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.diameter = 20;
                this.xSpeed = 4;
                this.ySpeed = -4;
            }

            update() {
                this.x += this.xSpeed;
                this.y += this.ySpeed;
            }

            checkEdges() {
                if (this.x > width - this.diameter / 2 || this.x < this.diameter / 2) {
                    this.xSpeed *= -1;
                }
                if (this.y < this.diameter / 2) {
                    this.ySpeed *= -1;
                } else if (this.y > height - this.diameter / 2) {
                    noLoop();
                }
            }

            checkPaddle(paddle) {
                if (this.x > paddle.x && this.x < paddle.x + paddle.width &&
                    this.y + this.diameter / 2 > paddle.y) {
                    this.ySpeed *= -1;
                    this.y = paddle.y - this.diameter / 2;
                }
            }

            hits(brick) {
                if (this.x > brick.x && this.x < brick.x + brickWidth &&
                    this.y > brick.y && this.y < brick.y + brickHeight) {
                    return true;
                }
                return false;
            }

            reverseY() {
                this.ySpeed *= -1;
            }

            show() {
                fill(255);
                noStroke();
                ellipse(this.x, this.y, this.diameter);
            }
        }

        class Paddle {
            constructor() {
                this.width = 100;
                this.height = 20;
                this.x = width / 2 - this.width / 2;
                this.y = height - this.height - 10;
                this.xSpeed = 0;
                this.isMovingLeft = false;
                this.isMovingRight = false;
            }

            update() {
                if (this.isMovingLeft) {
                    this.xSpeed = -5;
                } else if (this.isMovingRight) {
                    this.xSpeed = 5;
                } else {
                    this.xSpeed = 0;
                }
                this.x += this.xSpeed;
                this.x = constrain(this.x, 0, width - this.width);
            }

            show() {
                fill(255);
                noStroke();
                rect(this.x, this.y, this.width, this.height);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.visible = true;
            }

            show() {
                fill(255, 0, 0);
                noStroke();
                rect(this.x, this.y, brickWidth, brickHeight);
            }
        }
    </script>
</head>
<body>
</body>
</html>
