<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Breaker Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <script>
        let bricks = [];
        let cols = 10;
        let rows = 5;
        let brickWidth;
        let brickHeight = 20;
        let paddle;
        let ball;
        let isGameOver = false;

        function setup() {
            createCanvas(400, 400);
            brickWidth = width / cols;
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    bricks.push(new Brick(i * brickWidth, j * brickHeight));
                }
            }
            paddle = new Paddle();
            ball = new Ball();
        }

        function draw() {
            background(220);
            if (!isGameOver) {
                for (let i = bricks.length - 1; i >= 0; i--) {
                    bricks[i].show();
                    if (bricks[i].hit(ball)) {
                        ball.reverseY();
                        bricks.splice(i, 1);
                    }
                }
                paddle.show();
                paddle.update();
                ball.show();
                ball.update();
                ball.checkEdges();
                ball.checkPaddle(paddle);
            } else {
                textSize(32);
                fill(0);
                textAlign(CENTER, CENTER);
                text("Game Over", width / 2, height / 2);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.w = brickWidth;
                this.h = brickHeight;
            }

            show() {
                fill(0, 0, 255);
                rect(this.x, this.y, this.w, this.h);
            }

            hit(ball) {
                if (ball.pos.x > this.x && ball.pos.x < this.x + this.w && 
                    ball.pos.y > this.y && ball.pos.y < this.y + this.h) {
                    return true;
                }
                return false;
            }
        }

        class Paddle {
            constructor() {
                this.w = 80;
                this.h = 10;
                this.x = width / 2 - this.w / 2;
                this.y = height - 20;
                this.speed = 5;
            }

            show() {
                fill(50);
                rect(this.x, this.y, this.w, this.h);
            }

            update() {
                if (keyIsDown(LEFT_ARROW)) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW)) {
                    this.x += this.speed;
                }
                this.x = constrain(this.x, 0, width - this.w);
            }
        }

        class Ball {
            constructor() {
                this.pos = createVector(width / 2, height / 2);
                this.r = 10;
                this.vel = createVector(3, -3);
            }

            show() {
                fill(255, 0, 0);
                ellipse(this.pos.x, this.pos.y, this.r * 2);
            }

            update() {
                this.pos.add(this.vel);
            }

            reverseY() {
                this.vel.y *= -1;
            }

            checkEdges() {
                if (this.pos.x < this.r || this.pos.x > width - this.r) {
                    this.vel.x *= -1;
                }
                if (this.pos.y < this.r) {
                    this.vel.y *= -1;
                }
                if (this.pos.y > height) {
                    isGameOver = true;
                }
            }

            checkPaddle(paddle) {
                if (this.pos.y + this.r > paddle.y && 
                    this.pos.x > paddle.x && 
                    this.pos.x < paddle.x + paddle.w) {
                    this.reverseY();
                    this.pos.y = paddle.y - this.r;
                }
            }
        }
    </script>
</body>
</html>
