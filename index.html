<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #222; color: white; text-align: center; }
        canvas { border: 1px solid white; }
    </style>
</head>
<body>
    <h1>ブロック崩しゲーム</h1>
    <p>スコア: <span id="score">0</span></p>
    <div id="restart" style="display: none; cursor: pointer;">再スタート</div>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(480, 320);
            ball = new Ball();
            paddle = new Paddle();
            generateBricks();
        }

        function draw() {
            background(0);
            if (gameOver) {
                fill(255);
                textSize(32);
                text('ゲームオーバー', width / 2 - 100, height / 2);
                document.getElementById("restart").style.display = "block";
                return;
            }
            paddle.show();
            paddle.update();
            ball.show();
            ball.update(paddle);
            for (let brick of bricks) {
                brick.show();
                if (ball.hits(brick)) {
                    ball.reverseY();
                    bricks.splice(bricks.indexOf(brick), 1);
                    score++;
                    document.getElementById("score").innerText = score;
                }
            }
            if (ball.y > height) {
                gameOver = true;
            }
        }

        function generateBricks() {
            let rows = 5;
            let cols = 6;
            let w = width / cols;
            let h = 20;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push(new Brick(j * w, i * h, w, h));
                }
            }
        }

        function mouseMoved() {
            paddle.move(mouseX);
        }

        function keyPressed() {
            if (key === 'R' || key === 'r') {
                restartGame();
            }
        }

        function restartGame() {
            score = 0;
            document.getElementById("score").innerText = score;
            gameOver = false;
            bricks = [];
            generateBricks();
            ball = new Ball();
            document.getElementById("restart").style.display = "none";
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.radius = 12;
                this.xSpeed = 5;
                this.ySpeed = -5;
            }
            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }
            update(paddle) {
                this.x += this.xSpeed;
                this.y += this.ySpeed;
                if (this.x > width || this.x < 0) {
                    this.xSpeed *= -1;
                }
                if (this.y < 0) {
                    this.ySpeed *= -1;
                }
                if (this.y > height) {
                    gameOver = true;
                }
                if (this.y + this.radius >= paddle.y && this.x > paddle.x && this.x < paddle.x + paddle.width) {
                    this.ySpeed *= -1;
                }
            }
            hits(brick) {
                return this.x > brick.x && this.x < brick.x + brick.width && this.y - this.radius < brick.y + brick.height && this.y + this.radius > brick.y;
            }
            reverseY() {
                this.ySpeed *= -1;
            }
        }

        class Paddle {
            constructor() {
                this.width = 80;
                this.height = 10;
                this.x = (width - this.width) / 2;
                this.y = height - this.height;
            }
            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
            update() {
                this.x = constrain(this.x, 0, width - this.width);
            }
            move(x) {
                this.x = x - this.width / 2;
            }
        }

        class Brick {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }
            show() {
                fill(255, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
