<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let gameOver = false;

        function setup() {
            createCanvas(480, 320);
            ball = new Ball();
            paddle = new Paddle();
            let rows = 5;
            let cols = 7;
            let brickWidth = width / cols;
            let brickHeight = 20;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * brickWidth, r * brickHeight));
                }
            }
        }

        function draw() {
            background(0);
            if (gameOver) {
                textSize(32);
                textAlign(CENTER);
                fill(255);
                text('Game Over', width / 2, height / 2);
                text('Score: ' + score, width / 2, height / 2 + 40);
                textSize(16);
                text('Press R to Restart', width / 2, height / 2 + 80);
                return;
            }

            ball.update();
            ball.show();
            paddle.show();
            paddle.move();

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.hits(bricks[i])) {
                    ball.reverse();
                    bricks.splice(i, 1);
                    score++;
                }
            }

            if (ball.y > height) {
                gameOver = true;
            }

            fill(255);
            textSize(16);
            text('Score: ' + score, 10, 20);
        }

        function keyPressed() {
            if (key === 'r' || key === 'R') {
                resetGame();
            }
        }

        function resetGame() {
            ball = new Ball();
            paddle = new Paddle();
            bricks = [];
            score = 0;
            gameOver = false;
            let rows = 5;
            let cols = 7;
            let brickWidth = width / cols;
            let brickHeight = 20;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    bricks.push(new Brick(c * brickWidth, r * brickHeight));
                }
            }
        }

        class Ball {
            constructor() {
                this.radius = 12;
                this.x = width / 2;
                this.y = height - 30;
                this.speedX = 3;
                this.speedY = -3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < this.radius || this.x > width - this.radius) {
                    this.speedX *= -1;
                }
                if (this.y < this.radius) {
                    this.speedY *= -1;
                }
            }

            show() {
                fill(255);
                ellipse(this.x, this.y, this.radius * 2);
            }

            reverse() {
                this.speedY *= -1;
            }

            hits(brick) {
                return (this.x > brick.x && this.x < brick.x + brick.width &&
                        this.y - this.radius < brick.y + brick.height &&
                        this.y + this.radius > brick.y);
            }
        }

        class Paddle {
            constructor() {
                this.width = 75;
                this.height = 10;
                this.x = (width - this.width) / 2;
                this.y = height - this.height - 10;
                this.speed = 5;
            }

            move() {
                if (keyIsDown(LEFT_ARROW) && this.x > 0) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW) && this.x < width - this.width) {
                    this.x += this.speed;
                }
            }

            show() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = width / 7;
                this.height = 20;
            }

            show() {
                fill(200, 0, 0);
                rect(this.x, this.y, this.width, this.height);
            }
        }
    </script>
</body>
</html>
