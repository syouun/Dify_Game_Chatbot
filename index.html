<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ブロック崩しゲーム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #222; }
        canvas { border: 1px solid white; }
    </style>
</head>
<body>
    <script>
        let ball;
        let paddle;
        let bricks = [];
        let score = 0;
        let isGameOver = false;

        function setup() {
            createCanvas(400, 600);
            ball = new Ball();
            paddle = new Paddle();
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    bricks.push(new Brick(j * 50 + 25, i * 30 + 30));
                }
            }
        }

        function draw() {
            background(0);
            if (isGameOver) {
                fill(255);
                textSize(32);
                textAlign(CENTER);
                text('Game Over', width / 2, height / 2);
                textSize(16);
                text('Score: ' + score, width / 2, height / 2 + 30);
                text('Press Space to Restart', width / 2, height / 2 + 50);
                return;
            }

            paddle.show();
            paddle.update();

            ball.show();
            ball.update();
            ball.checkCollision(paddle);

            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].show();
                if (ball.checkCollision(bricks[i])) {
                    bricks.splice(i, 1);
                    score++;
                }
            }

            fill(255);
            textSize(16);
            text('Score: ' + score, 10, 20);
            
            if (bricks.length === 0) {
                isGameOver = true;
            }
        }

        function keyPressed() {
            if (key === ' ' && isGameOver) {
                restart();
            }
        }

        function restart() {
            isGameOver = false;
            score = 0;
            bricks = [];
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 8; j++) {
                    bricks.push(new Brick(j * 50 + 25, i * 30 + 30));
                }
            }
            ball = new Ball();
            paddle = new Paddle();
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height - 30;
                this.r = 12;
                this.speedX = 5;
                this.speedY = -5;
            }

            show() {
                fill(255, 204, 0);
                ellipse(this.x, this.y, this.r * 2);
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < this.r || this.x > width - this.r) {
                    this.speedX *= -1;
                }
                if (this.y < this.r) {
                    this.speedY *= -1;
                }
                if (this.y > height) {
                    isGameOver = true;
                }
            }

            checkCollision(target) {
                if (this.x > target.x && this.x < target.x + target.w && this.y + this.r > target.y) {
                    this.speedY *= -1;
                    this.y = target.y - this.r;
                    return true;
                }
                return false;
            }
        }

        class Paddle {
            constructor() {
                this.w = 100;
                this.h = 20;
                this.x = width / 2 - this.w / 2;
            }

            show() {
                fill(255);
                rect(this.x, height - this.h - 10, this.w, this.h);
            }

            update() {
                this.x = mouseX - this.w / 2;
                this.x = constrain(this.x, 0, width - this.w);
            }
        }

        class Brick {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.w = 50;
                this.h = 20;
            }

            show() {
                fill(255, 204, 0);
                rect(this.x, this.y, this.w, this.h);
            }
        }
    </script>
</body>
</html>
