<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩しゲーム</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script>
        let paddle;
        let ball;
        let bricks = [];
        const rows = 5;
        const cols = 8;
        const brickWidth = 50;
        const brickHeight = 20;
        const paddleWidth = 100;
        const paddleHeight = 10;

        function setup() {
            createCanvas(500, 400);
            paddle = new Paddle();
            ball = new Ball();
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    let color = color(random(255), random(255), random(255));
                    bricks.push(new Brick(j * (brickWidth + 10) + 35, i * (brickHeight + 10) + 30, color));
                }
            }
        }

        function draw() {
            background(0);
            paddle.display();
            paddle.update();
            ball.display();
            ball.update(paddle);
            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].display();
                if (ball.hits(bricks[i])) {
                    bricks.splice(i, 1);
                    ball.reverseY();
                }
            }
            if (bricks.length === 0) {
                noLoop();
                textSize(32);
                fill(255);
                textAlign(CENTER, CENTER);
                text('You Win!', width / 2, height / 2);
            }
        }

        class Paddle {
            constructor() {
                this.width = paddleWidth;
                this.height = paddleHeight;
                this.x = width / 2 - this.width / 2;
                this.y = height - this.height - 30;
                this.speed = 5;
            }
            display() {
                fill(255);
                rect(this.x, this.y, this.width, this.height);
            }
            update() {
                if (keyIsDown(LEFT_ARROW)) {
                    this.x -= this.speed;
                }
                if (keyIsDown(RIGHT_ARROW)) {
                    this.x += this.speed;
                }
                this.x = constrain(this.x, 0, width - this.width);
            }
        }

        class Ball {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.r = 10;
                this.xspeed = 3;
                this.yspeed = 3;
            }
            display() {
                fill(255);
                ellipse(this.x, this.y, this.r * 2);
            }
            update(paddle) {
                this.x += this.xspeed;
                this.y += this.yspeed;

                if (this.x < 0 || this.x > width) {
                    this.xspeed *= -1;
                }
                if (this.y < 0) {
                    this.yspeed *= -1;
                }

                if (this.hitsPaddle(paddle)) {
                    this.yspeed *= -1;
                    this.y = paddle.y - this.r;
                }

                if (this.y > height) {
                    noLoop();
                    textSize(32);
                    fill(255);
                    textAlign(CENTER, CENTER);
                    text('Game Over', width / 2, height / 2);
                }
            }
            hits(brick) {
                let distX = abs(this.x - brick.x - brickWidth / 2);
                let distY = abs(this.y - brick.y - brickHeight / 2);

                if (distX > (brickWidth / 2 + this.r)) { return false; }
                if (distY > (brickHeight / 2 + this.r)) { return false; }

                if (distX <= (brickWidth / 2)) { return true; }
                if (distY <= (brickHeight / 2)) { return true; }

                let dx = distX - brickWidth / 2;
                let dy = distY - brickHeight / 2;
                return (dx * dx + dy * dy <= (this.r * this.r));
            }
            hitsPaddle(paddle) {
                return this.x > paddle.x && this.x < paddle.x + paddle.width && this.y + this.r > paddle.y;
            }
            reverseY() {
                this.yspeed *= -1;
            }
        }

        class Brick {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.w = brickWidth;
                this.h = brickHeight;
                this.color = color;
            }
            display() {
                fill(this.color);
                rect(this.x, this.y, this.w, this.h);
            }
        }
    </script>
</head>
<body>
</body>
</html>
